<!doctype html>
<html lang="ru">
  <head>
    <!-- =========================================================
         БАЗОВЫЕ НАСТРОЙКИ ДОКУМЕНТА
         Кодировка, адаптивность и favicon.
         ========================================================= -->

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- =========================================================
         SEO / БАЗОВАЯ ПОИСКОВАЯ ОПТИМИЗАЦИЯ
         Минимальный SEO-каркас для MVP.
         ========================================================= -->

    <title>Энергоэффект — инженерная производственная платформа</title>

    <meta
      name="description"
      content="Энергоэффект проектирует и производит БМК, БТП, ВНС, ПНС, шкафы управления и автоматизации, а также выполняет проектирование, СМР и пусконаладку инженерных объектов."
    />

    <link rel="canonical" href="https://www.energoeffekt-rostov.ru/" />

    <!-- =========================================================
         OPEN GRAPH / ПРЕВЬЮ ДЛЯ СОЦСЕТЕЙ И МЕССЕНДЖЕРОВ
         Позже og:image можно заменить на финальную картинку сайта.
         ========================================================= -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Энергоэффект — инженерная производственная платформа" />
    <meta
      property="og:description"
      content="Производство БМК, БТП, ВНС, ПНС, шкафов управления и автоматизации. Проектирование, СМР и пусконаладка инженерных объектов."
    />
    <meta property="og:url" content="https://www.energoeffekt-rostov.ru/" />
    <meta property="og:image" content="https://www.energoeffekt-rostov.ru/og-image.jpg" />
    <meta property="og:locale" content="ru_RU" />

    <!-- =========================================================
         AI / AEO / GEO READY
         Краткое машинопонятное описание сайта.
         ========================================================= -->

    <meta
      name="summary"
      content="Сайт ООО Энергоэффект: производственная инженерная платформа для БМК, БТП, ВНС, ПНС, шкафов управления, проектирования, СМР и пусконаладки."
    />
        <!-- =========================================================
      STRUCTURED DATA / СТРУКТУРИРОВАННЫЕ ДАННЫЕ

      Organization JSON-LD помогает поисковым системам понимать:
      - кто владелец сайта;
      - какой официальный сайт компании;
      - как связаться с организацией.

      Это базовый SEO / AEO / GEO-фундамент для production-сайта.
    ========================================================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ООО «Энергоэффект»",
        "url": "https://www.energoeffekt-rostov.ru/",
        "telephone": "+7 938 169-31-09",
        "email": "info@energoeffect.ru",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ростов-на-Дону",
          "addressRegion": "Ростовская область",
          "addressCountry": "RU"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
