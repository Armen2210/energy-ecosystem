      <path d="M525 154H842Q866 154 866 178V276Q866 300 890 300H1137"/>
      <path d="M525 166H830Q854 166 854 190V288Q854 312 878 312H1137"/>
      <path d="M1343 300H1470Q1494 300 1494 276V122Q1494 98 1518 98H1608"/>
      <path d="M1343 312H1482Q1506 312 1506 288V134Q1506 110 1530 110H1608"/>
      <path d="M1137 306H1343" stroke-dasharray="15 8 3 8"/>
    </g>

    <!-- Центральный фланцевый узел, частично связанный с трассой -->
    <g stroke-width="1.1">
      <circle cx="1240" cy="306" r="103"/>
      <circle cx="1240" cy="306" r="86"/>
      <circle cx="1240" cy="306" r="30"/>
      <circle cx="1240" cy="232" r="6"/>
      <circle cx="1314" cy="306" r="6"/>
      <circle cx="1240" cy="380" r="6"/>
      <circle cx="1166" cy="306" r="6"/>
      <path d="M1222 288L1258 324M1258 288L1222 324"/>
    </g>

    <!-- Фланцевые стыки на трассе -->
    <g stroke-width="1">
      <path d="M680 142V178M694 142V178"/>
      <path d="M920 288V324M934 288V324"/>
      <path d="M1392 288V324M1406 288V324"/>
      <path d="M1482 188H1518M1482 202H1518"/>
      <circle cx="687" cy="160" r="4"/>
      <circle cx="927" cy="306" r="4"/>
      <circle cx="1399" cy="306" r="4"/>
      <circle cx="1500" cy="195" r="4"/>
    </g>

    <!-- Монтажные опоры и точки крепления -->
    <g stroke-width="0.95">
      <path d="M748 166V218H714M782 218H714"/>
      <path d="M1020 312V372H982M1058 372H982"/>
      <path d="M1445 312V372H1407M1483 372H1407"/>
      <path d="M731 218V236M1001 372V390M1426 372V390"/>
      <path d="M704 236H758M974 390H1028M1399 390H1453"/>
      <path d="M712 242H750M982 396H1020M1407 396H1445"/>
    </g>

    <!-- Осевая линия объединяет трассу и узел -->
    <g stroke-width="0.8" stroke-dasharray="15 9 3 9">
      <path d="M500 160H866V306H1600"/>
      <path d="M1240 38V488"/>
    </g>

    <!-- Размерные привязки над трассой -->
    <g stroke-width="0.9">
      <path d="M525 126V74M866 150V74"/>
      <path d="M533 88H858" marker-start="url(#mount-arrow)" marker-end="url(#mount-arrow)"/>
      <path d="M866 112H936M866 276H936"/>
      <path d="M922 120V268" marker-start="url(#mount-arrow)" marker-end="url(#mount-arrow)"/>
      <path d="M1060 246V214M1420 288V214"/>
      <path d="M1068 228H1412" marker-start="url(#mount-arrow)" marker-end="url(#mount-arrow)"/>
    </g>

    <!-- Размерные привязки снизу и справа -->
    <g stroke-width="0.85">
      <path d="M878 330V452M1494 318V452"/>
      <path d="M886 438H1486" marker-start="url(#mount-arrow)" marker-end="url(#mount-arrow)"/>
      <path d="M1524 110H1562M1512 300H1562"/>
      <path d="M1548 118V292" marker-start="url(#mount-arrow)" marker-end="url(#mount-arrow)"/>
    </g>

    <!-- Монтажные пересечения и контрольные отметки -->
    <g stroke-width="0.75">
      <path d="M846 152L874 180M874 152L846 180"/>
      <path d="M852 292L880 320M880 292L852 320"/>
      <path d="M1228 232H1252M1240 220V244"/>
      <path d="M1302 306H1326M1314 294V318"/>
      <path d="M1228 380H1252M1240 368V392"/>
      <circle cx="860" cy="166" r="5"/>
      <circle cx="866" cy="306" r="5"/>
      <path d="M582 58H638M582 58V114"/>
      <path d="M1550 30H1590V70M1590 430V470H1550"/>
    </g>
  </g>
</svg>
