<svg xmlns="http://www.w3.org/2000/svg" width="162" height="88" viewBox="0 0 162 88" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">12 лет — Энергоэффект</title>
  <desc id="desc">Оранжевый геометрический знак 12 лет с символом инженерного трубопроводного узла</desc>

  <!-- Геометрическая цифра 1 -->
