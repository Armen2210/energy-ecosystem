server {
    listen 80;
    server_name td-energoeffect.ru www.td-energoeffect.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name td-energoeffect.ru www.td-energoeffect.ru 185.207.64.170;

    ssl_certificate /etc/letsencrypt/live/td-energoeffect.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/td-energoeffect.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/td_site/td_site/backend/staticfiles/;
    }

    location /media/ {
        alias /var/www/td_site/td_site/backend/media/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-secret-123/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/td_site/td_site/frontend/dist;
        try_files $uri /index.html;
    }
    }
